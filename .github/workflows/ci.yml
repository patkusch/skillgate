name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests
      - name: The clean fixture passes and the sneaky one is blocked
        run: |
          python -m skillgate scan fixtures/clean
          ! python -m skillgate scan fixtures/sneaky
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: The action passes on a clean skill
        uses: ./
        with: { path: fixtures/clean }
      - name: The action fails on a sneaky skill
        id: bad
        uses: ./
        with: { path: fixtures/sneaky }
        continue-on-error: true
      - run: test "${{ steps.bad.outcome }}" = "failure"
