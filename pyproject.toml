[project]
name = "skillgate"
version = "0.1.0"
description = "Check an agent skill before you install it: what it can touch, what it says it does, and whether it changed since you approved it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Patricia Kusch" }]
keywords = ["ai-agents", "agent-skills", "security", "supply-chain", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/patkusch/skillgate"
Repository = "https://github.com/patkusch/skillgate"
Issues = "https://github.com/patkusch/skillgate/issues"

[project.scripts]
skillgate = "skillgate.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skillgate"]
